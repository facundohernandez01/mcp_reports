server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  # Sin esto, nginx redirige /login a http://localhost/login/ (se come el
  # puerto: rompe el redirectUri de MSAL y toda navegación a subrutas).
  absolute_redirect off;
  port_in_redirect on;

  # SPA + páginas estáticas de Astro.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Misma API que el backend Yoga (mismo origen: sin CORS en prod).
  # SSE (subscriptions) sin buffer. El upstream va por variable + resolver
  # Docker para NO fallar al arrancar si el backend aún no resolvía DNS.
  resolver 127.0.0.11 valid=10s;
  set $upstream_backend backend:4001;
  location /graphql {
    proxy_pass http://$upstream_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
  }

  # OAuth del MCP (Claude web): metadata + endpoints van al server MCP.
  set $upstream_mcp mcp:4002;
  location = /.well-known/oauth-protected-resource/mcp {
    proxy_pass http://$upstream_mcp;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location = /.well-known/oauth-authorization-server {
    proxy_pass http://$upstream_mcp;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location /oauth/ {
    proxy_pass http://$upstream_mcp;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Uploads (imágenes de widgets): mismo volumen que el backend.
  location /uploads/ {
    alias /srv/uploads/;
    expires 7d;
    add_header Cache-Control "public";
  }

  # MCP por el mismo dominio público (https://dominio/mcp): el agente se
  # conecta sin exponer el :4002. SSE/streaming sin buffer.
  location /mcp {
    proxy_pass http://$upstream_mcp;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
    # SSE: cortar el buffering también a nivel de chunks.
    chunked_transfer_encoding off;
  }
}
